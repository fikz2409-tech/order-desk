<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order Desk</title>

<!-- PWA: lets this be installed to a phone home screen like a real app -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1C2230">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">

<!-- iOS Safari doesn't fully support the manifest spec, so it needs its
     own explicit tags for "Add to Home Screen" to look/behave right -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Order Desk">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --paper:#faf9f5;
    --paper-raised:#ffffff;
    --ink:#1c2230;
    --ink-soft:#5b6472;
    --line:#e2e0d8;
    --pending:#b5482f;
    --pending-bg:#fbe9e3;
    --processing:#2560a8;
    --processing-bg:#e5eef9;
    --paid:#1c7a56;
    --paid-bg:#e2f3ea;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}
  .app{max-width:920px;margin:0 auto;padding:28px 20px 80px;}
  header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:24px;flex-wrap:wrap;gap:14px;}
  header h1{font-family:'Space Grotesk',sans-serif;font-size:28px;margin:0;letter-spacing:-0.01em;}
  header .sub{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .tabs{display:flex;gap:8px;align-items:center;}
  .tab{font-family:'IBM Plex Mono',monospace;font-size:13px;padding:8px 16px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;border-radius:2px;}
  .tab.active{background:var(--ink);color:var(--paper);}
  .logout-btn{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);background:none;border:none;text-decoration:underline;cursor:pointer;}

  /* LOGIN */
  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .login-box{background:var(--paper-raised);border:1px solid var(--line);border-radius:6px;padding:32px;width:100%;max-width:360px;}
  .login-box h1{font-family:'Space Grotesk',sans-serif;font-size:24px;margin:0 0 4px;}
  .login-box .sub{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin-bottom:22px;}
  .role-toggle{display:flex;gap:8px;margin-bottom:16px;}
  .role-btn{flex:1;padding:10px;border:1px solid var(--line);background:#fff;border-radius:3px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .role-btn.active{border-color:var(--ink);background:var(--ink);color:#fff;}
  .login-box input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:3px;font-size:14px;margin-bottom:14px;}
  .login-btn{width:100%;padding:12px;background:var(--ink);color:#fff;border:none;border-radius:3px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;cursor:pointer;}
  .login-error{color:var(--pending);font-family:'IBM Plex Mono',monospace;font-size:12px;margin-top:10px;display:none;}

  /* TICKET FORM */
  .ticket{background:var(--paper-raised);border:1px solid var(--line);border-radius:4px;padding:24px;position:relative;}
  .ticket::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:repeating-linear-gradient(90deg, var(--ink) 0 8px, transparent 8px 14px);opacity:.15;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:6px;}
  .field input, .field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:3px;font-family:'Inter',sans-serif;font-size:14px;background:#fff;color:var(--ink);}
  .field textarea{resize:vertical;min-height:70px;font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .field input:focus, .field textarea:focus{outline:2px solid var(--processing);outline-offset:1px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .submit-btn{width:100%;padding:13px;background:var(--ink);color:var(--paper);border:none;border-radius:3px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;cursor:pointer;margin-top:6px;}
  .submit-btn:disabled{opacity:.5;cursor:default;}
  .confirm{margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--paid);display:none;}

  /* ADMIN */
  .filters{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .filter-btn{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:20px;cursor:pointer;color:var(--ink-soft);}
  .filter-btn.active{border-color:var(--ink);color:var(--ink);background:#f0efe9;}
  .order-card{background:var(--paper-raised);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:3px;padding:16px 18px;margin-bottom:12px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .order-card.status-pending{border-left-color:var(--pending);}
  .order-card.status-processing{border-left-color:var(--processing);}
  .order-card.status-paid{border-left-color:var(--paid);}
  .order-main{flex:1;min-width:220px;}
  .order-id{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .order-customer{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:17px;margin:2px 0 6px;}
  .order-items{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink);white-space:pre-wrap;}
  .order-meta{font-size:12px;color:var(--ink-soft);margin-top:8px;}
  .order-meta span{margin-right:14px;}
  .order-actions{display:flex;flex-direction:column;align-items:flex-end;gap:10px;justify-content:flex-start;min-width:190px;}
  .badge{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:4px 10px;border-radius:20px;font-weight:600;}
  .badge.status-pending{background:var(--pending-bg);color:var(--pending);}
  .badge.status-processing{background:var(--processing-bg);color:var(--processing);}
  .badge.status-paid{background:var(--paid-bg);color:var(--paid);}
  .badge.ship-notpacked{background:#eee;color:#6b6b6b;}
  .badge.ship-packed{background:#fdf0d5;color:#9a6a12;}
  .badge.ship-shipped{background:var(--paid-bg);color:var(--paid);}
  .status-select{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:6px 8px;border:1px solid var(--line);border-radius:3px;background:#fff;cursor:pointer;}
  .fulfill-block{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);width:100%;}
  .fulfill-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .fulfill-row input{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:6px 8px;border:1px solid var(--line);border-radius:3px;flex:1;min-width:120px;}

  .po-attach-row{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap;}
  .po-file-input, .invoice-file-input, .slip-file-input{font-family:'IBM Plex Mono',monospace;font-size:11px;max-width:200px;}
  .po-download-btn, .po-remove-btn{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:4px 10px;border-radius:3px;cursor:pointer;background:#fff;}
  .po-download-btn{border:1px solid var(--processing);color:var(--processing);}
  .po-remove-btn{border:1px solid var(--pending);color:var(--pending);}
  .badges-row{display:flex;gap:6px;flex-wrap:wrap;}
  .history-toggle{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);background:none;border:none;text-decoration:underline;cursor:pointer;padding:0;margin-top:8px;}
  .history-list{margin-top:8px;padding-left:12px;border-left:2px solid var(--line);display:none;}
  .history-list.open{display:block;}
  .history-item{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-bottom:5px;line-height:1.4;}
  .history-item .ts{color:var(--ink);}
  .share-block{margin-top:10px;background:var(--paid-bg);border:1px solid #bfe0cd;border-radius:3px;padding:10px 12px;display:none;}
  .share-block.show{display:block;}
  .share-block .ship-line{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--paid);margin-bottom:6px;}
  .copy-btn{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:5px 10px;border:1px solid var(--paid);color:var(--paid);background:#fff;border-radius:3px;cursor:pointer;}
  .copy-btn.copied{background:var(--paid);color:#fff;}
  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .counts{display:flex;gap:18px;margin-bottom:18px;font-family:'IBM Plex Mono',monospace;font-size:12px;flex-wrap:wrap;}
  .counts .count-item{display:flex;align-items:center;gap:6px;}
  .dot{width:8px;height:8px;border-radius:50%;}
  .dot.status-pending{background:var(--pending);}
  .dot.status-processing{background:var(--processing);}
  .dot.status-paid{background:var(--paid);}
  .loading{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft);padding:20px 0;}

  .export-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:12px 14px;background:var(--paper-raised);border:1px solid var(--line);border-radius:4px;}
  .export-bar label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);}
  .export-bar input[type=date]{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:3px;}
  .export-btn{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:7px 14px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:3px;cursor:pointer;}
  .export-btn.secondary{background:#fff;color:var(--ink);}
  .export-btn:disabled{opacity:.5;cursor:default;}

  .followup-toggle{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);cursor:pointer;}
  .followup-section{display:none;border:1px dashed var(--line);border-radius:4px;padding:14px;margin-bottom:16px;}
  .followup-section.open{display:block;}
  .followup-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .followup-row input[type=text]{flex:2;padding:8px 10px;border:1px solid var(--line);border-radius:3px;font-size:13px;}
  .followup-row input[type=date]{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:3px;font-size:13px;}
  .followup-row .rm-btn{background:none;border:none;color:var(--pending);cursor:pointer;font-size:16px;padding:0 6px;}
  .add-followup-btn{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:6px 12px;border:1px dashed var(--ink-soft);background:none;border-radius:3px;cursor:pointer;color:var(--ink-soft);}

  .followup-block{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);width:100%;}
  .followup-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;font-family:'IBM Plex Mono',monospace;font-size:12px;}
  .followup-item .fu-desc{flex:1;}
  .followup-item.fulfilled .fu-desc{color:var(--ink-soft);text-decoration:line-through;}
  .fu-due{color:var(--ink-soft);font-size:11px;}
  .fu-due.overdue{color:var(--pending);font-weight:600;}
  .fu-mark-btn{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:4px 10px;border:1px solid var(--paid);color:var(--paid);background:#fff;border-radius:3px;cursor:pointer;}
  .fu-mark-btn.undo{border-color:var(--ink-soft);color:var(--ink-soft);}

  /* PRODUCTS TAB */
  .upload-box{background:var(--paper-raised);border:2px dashed var(--line);border-radius:6px;padding:28px;text-align:center;margin-bottom:20px;}
  .upload-box input[type=file]{margin-top:10px;}
  .upload-hint{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-top:8px;}
  .table-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:16px;}
  .preview-table, .catalog-table{width:100%;min-width:520px;border-collapse:collapse;font-size:13px;margin-bottom:0;}
  .preview-table th, .catalog-table th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--line);padding:8px 10px;}
  .preview-table td, .catalog-table td{padding:8px 10px;border-bottom:1px solid var(--line);font-family:'IBM Plex Mono',monospace;}
  .confirm-upload-btn{padding:11px 20px;background:var(--ink);color:#fff;border:none;border-radius:3px;font-family:'Space Grotesk',sans-serif;font-weight:600;cursor:pointer;}
  .catalog-search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:3px;margin-bottom:14px;font-size:13px;}
  .del-sku-btn{background:none;border:none;color:var(--pending);cursor:pointer;font-size:13px;}

  /* SALES: SKU LINE ITEM PICKER */
  .item-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap;}
  .item-row input[list]{flex:2;min-width:160px;padding:8px 10px;border:1px solid var(--line);border-radius:3px;font-size:13px;}
  .item-row input[type=number]{width:70px;padding:8px 10px;border:1px solid var(--line);border-radius:3px;font-size:13px;}
  .add-item-btn{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:7px 14px;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:3px;cursor:pointer;}
  .line-items-table{width:100%;min-width:460px;border-collapse:collapse;font-size:13px;}
  .line-items-table th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;color:var(--ink-soft);padding:6px 8px;border-bottom:1px solid var(--line);}
  .line-items-table td{padding:6px 8px;border-bottom:1px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .line-items-table .rm-line-btn{background:none;border:none;color:var(--pending);cursor:pointer;}
  .order-total-line{text-align:right;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;margin:6px 0 16px;}
  @media (max-width:600px){
    .app{padding:16px 14px 80px;}
    .row2{grid-template-columns:1fr;}
    header{flex-direction:column;align-items:flex-start;gap:14px;}
    header h1{font-size:24px;}

    .tabs{width:100%;flex-wrap:wrap;gap:6px;}
    .tab{flex:1 1 auto;text-align:center;padding:9px 10px;}
    .logout-btn{width:100%;text-align:center;margin-top:4px;}

    .login-box{padding:24px 20px;max-width:100%;}

    .order-card{flex-direction:column;padding:14px;}
    .order-actions{width:100%;align-items:stretch;min-width:0;}
    .badges-row{justify-content:flex-start;}
    .order-actions select, .order-actions .status-select{width:100%;}

    .item-row{flex-direction:column;align-items:stretch;}
    .item-row input, .item-row .add-item-btn{width:100%;}

    .fulfill-row{flex-direction:column;align-items:stretch;}
    .fulfill-row input, .fulfill-row textarea{width:100%;}

    .po-attach-row{flex-direction:column;align-items:flex-start;}
    .po-file-input, .invoice-file-input, .slip-file-input{max-width:100%;width:100%;}

    .export-bar{flex-direction:column;align-items:stretch;}
    .export-bar input[type=date]{width:100%;}
    .export-bar span{order:99;}

    .filters{gap:6px;}
    .filter-btn{flex:1 1 auto;text-align:center;}

    .share-block{padding:10px;}
    .followup-item{flex-wrap:wrap;}

    .catalog-search{font-size:16px;} /* 16px prevents iOS auto-zoom on focus */
    .ticket{padding:18px;}
    .field input, .field textarea, .fulfill-row input, .fulfill-row textarea,
    .item-row input, .followup-row input, .export-bar input, .login-box input{
      font-size:16px; /* 16px minimum prevents iOS Safari auto-zooming in on focus */
    }
  }

  @media (max-width:380px){
    .app{padding:12px 10px 72px;}
    header h1{font-size:21px;}
    .ticket{padding:14px;}
  }
</style>
</head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="login-box">
    <h1>Order Desk</h1>
    <div class="sub">SIGN IN TO CONTINUE</div>
    <div class="role-toggle">
      <button class="role-btn active" id="roleSales">Sales</button>
      <button class="role-btn" id="roleAdmin">Admin</button>
    </div>
    <input type="password" id="loginPassword" placeholder="Password">
    <button class="login-btn" id="loginBtn">Sign In</button>
    <div class="login-error" id="loginError">Incorrect password. Try again.</div>
  </div>
</div>

<div class="app" id="mainApp" style="display:none;">
  <header>
    <div>
      <h1>Order Desk</h1>
      <div class="sub" id="roleLabel">SALES INTAKE → ADMIN PROCESSING</div>
    </div>
    <div class="tabs">
      <button class="tab active" id="tabSales">Submit Order</button>
      <button class="tab" id="tabTrack" style="display:none;">Track Orders</button>
      <button class="tab" id="tabAdmin" style="display:none;">Admin Desk</button>
      <button class="tab" id="tabProducts" style="display:none;">Products</button>
      <button class="logout-btn" id="logoutBtn">Log out</button>
    </div>
  </header>
  <div id="salesView"></div>
  <div id="trackView" style="display:none;"></div>
  <div id="adminView" style="display:none;"></div>
  <div id="productsView" style="display:none;"></div>
</div>

<script>
const API = '/api';
let orders = [];
let products = [];
let lineItems = []; // items added to the current in-progress order via SKU picker
let currentFilter = 'all';
let authToken = localStorage.getItem('od_token') || null;
let authRole = localStorage.getItem('od_role') || null;
let loginRole = 'sales';

// ---------- LOGIN ----------
document.getElementById('roleSales').onclick = () => setLoginRole('sales');
document.getElementById('roleAdmin').onclick = () => setLoginRole('admin');
function setLoginRole(r){
  loginRole = r;
  document.getElementById('roleSales').classList.toggle('active', r==='sales');
  document.getElementById('roleAdmin').classList.toggle('active', r==='admin');
}

document.getElementById('loginBtn').onclick = async () => {
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  try{
    const res = await fetch(`${API}/login`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ role: loginRole, password })
    });
    if(!res.ok) throw new Error('bad creds');
    const data = await res.json();
    authToken = data.token;
    authRole = data.role;
    localStorage.setItem('od_token', authToken);
    localStorage.setItem('od_role', authRole);
    enterApp();
  }catch(e){
    errEl.style.display = 'block';
  }
};

document.getElementById('logoutBtn').onclick = () => {
  localStorage.removeItem('od_token');
  localStorage.removeItem('od_role');
  authToken = null; authRole = null;
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
};

async function enterApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  document.getElementById('roleLabel').textContent = authRole === 'admin' ? 'ADMIN VIEW' : 'SALES INTAKE';
  if(authRole === 'admin'){
    document.getElementById('tabAdmin').style.display = 'inline-block';
    document.getElementById('tabProducts').style.display = 'inline-block';
  } else {
    document.getElementById('tabTrack').style.display = 'inline-block';
  }
  await loadProducts();
  renderSales();
}

if(authToken && authRole){ enterApp(); }

async function apiFetch(path, opts={}){
  opts.headers = Object.assign({}, opts.headers, {
    'Authorization': 'Bearer ' + authToken,
    'Content-Type': 'application/json'
  });
  const res = await fetch(API + path, opts);
  if(res.status === 401 || res.status === 403){
    alert('Session expired or not authorized. Please log in again.');
    document.getElementById('logoutBtn').click();
    throw new Error('unauthorized');
  }
  let data = null;
  try { data = await res.json(); } catch(e) { /* no JSON body */ }
  if(!res.ok){
    throw new Error((data && data.error) || `Request failed (status ${res.status})`);
  }
  return data;
}

// ---------- SALES ----------
function renderSales(){
  const el = document.getElementById('salesView');
  el.innerHTML = `
    <div class="ticket">
      <div class="field"><label>Salesperson</label><input type="text" id="f_sales" placeholder="Your name"></div>
      <div class="field"><label>Your Email (for order updates)</label><input type="email" id="f_sales_email" placeholder="you@yourcompany.com"></div>
      <div class="row2">
        <div class="field"><label>Customer</label><input type="text" id="f_customer" placeholder="Customer / company name"></div>
        <div class="field"><label>PO Number (if applicable)</label><input type="text" id="f_po_number" placeholder="e.g. PO-2026-0456"></div>
      </div>
      <div class="field"><label>Delivery Address</label><textarea id="f_address" style="min-height:44px;font-family:'Inter',sans-serif;" placeholder="Full delivery address"></textarea></div>
      <div class="row2">
        <div class="field">
          <label>Customer Type (pricing tier)</label>
          <select id="f_customer_type" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:3px;font-size:14px;">
            <option value="original">Original Price</option>
            <option value="doctor">Doctor's Price</option>
            <option value="pharmacist">Pharmacist Price</option>
          </select>

function addFollowupRow(defaultDesc){
  const rows = document.getElementById('followupRows');
  const row = document.createElement('div');
  row.className = 'followup-row';
  row.innerHTML = `
    <input type="text" class="fu-desc-input" placeholder="e.g. Second 3-month batch" value="${defaultDesc || ''}">
    <input type="date" class="fu-date-input">
    <button type="button" class="rm-btn" title="Remove">×</button>
  `;
  row.querySelector('.rm-btn').onclick = () => row.remove();
  rows.appendChild(row);
}

function populateSkuDatalist(){
  const list = document.getElementById('skuDatalist');
  if(!list) return;
  list.innerHTML = products.map(p => `<option value="${escapeHtml(p.name)}"></option>`).join('');
}

function addLineItem(){
  const nameInput = document.getElementById('f_sku_input');
  const qtyInput = document.getElementById('f_qty_input');
  const nameVal = nameInput.value.trim();
  const qty = parseInt(qtyInput.value) || 1;
  if(!nameVal){ return; }

  const product = findProduct(nameVal);
  const tier = document.getElementById('f_customer_type').value;

  if(!product){
    // Not in catalog — still allow adding as a free-text line so sales isn't blocked.
    lineItems.push({ name: nameVal, qty, unitPrice: 0, inCatalog: false });
  } else {
    lineItems.push({ name: product.name, qty, unitPrice: priceForTier(product, tier), inCatalog: true });
  }
  nameInput.value = '';
  qtyInput.value = '1';
  renderLineItems();
}

function recalcLineItemPrices(){
  const tier = document.getElementById('f_customer_type').value;
  lineItems.forEach(li => {
    if(li.inCatalog){
      const product = findProduct(li.name);
      if(product) li.unitPrice = priceForTier(product, tier);
    }
  });
}

function removeLineItem(idx){
  lineItems.splice(idx, 1);
  renderLineItems();
}

function renderLineItems(){
  const wrap = document.getElementById('lineItemsWrap');
  if(!wrap) return;
  if(lineItems.length === 0){
    wrap.innerHTML = '<div class="ts" style="color:var(--ink-soft);margin-top:6px;">No items added yet.</div>';
    syncItemsAndAmount();
    return;
  }
  const total = lineItems.reduce((sum, li) => sum + (li.unitPrice * li.qty), 0);
  wrap.innerHTML = `
    <div class="table-scroll">
    <table class="line-items-table">
      <tr><th>Product</th><th>Qty</th><th>Unit Price</th><th>Line Total</th><th></th></tr>
      ${lineItems.map((li, idx) => `
        <tr>
          <td style="font-family:'Inter',sans-serif;">${escapeHtml(li.name)}${li.inCatalog ? '' : ' <span class="ts" style="color:var(--pending);">(not in catalog)</span>'}</td>
          <td>${li.qty}</td>
          <td>RM ${li.unitPrice.toFixed(2)}</td>
          <td>RM ${(li.unitPrice * li.qty).toFixed(2)}</td>
          <td><button type="button" class="rm-line-btn" data-rmline="${idx}">×</button></td>
        </tr>
      `).join('')}
    </table>
    </div>
    <div class="order-total-line">Order Total: RM ${total.toFixed(2)}</div>
  `;
  wrap.querySelectorAll('[data-rmline]').forEach(btn => {
    btn.onclick = () => removeLineItem(parseInt(btn.dataset.rmline));
  });
  syncItemsAndAmount();
}

function syncItemsAndAmount(){
  const itemsText = lineItems.map(li => `${li.name} x ${li.qty} (RM ${li.unitPrice.toFixed(2)} each)`).join('\n');
  const total = lineItems.reduce((sum, li) => sum + (li.unitPrice * li.qty), 0);
  const itemsField = document.getElementById('f_items');
  const amountField = document.getElementById('f_amount');
  if(itemsField) itemsField.value = itemsText;
  if(amountField && lineItems.length > 0) amountField.value = total.toFixed(2);
}

async function submitOrder(){
  const sales = document.getElementById('f_sales').value.trim();
  const salesEmail = document.getElementById('f_sales_email').value.trim();
  const customer = document.getElementById('f_customer').value.trim();
  const address = document.getElementById('f_address').value.trim();
  const amount = document.getElementById('f_amount').value.trim();
  const items = document.getElementById('f_items').value.trim();
  const notes = document.getElementById('f_notes').value.trim();
  const poNumber = document.getElementById('f_po_number').value.trim();
  const isCashSale = document.getElementById('f_cash_sale').checked;
  const paymentSlipFile = document.getElementById('f_payment_slip').files[0];
  if(!sales || !customer || !items){ alert('Please fill in salesperson, customer, and items at minimum.'); return; }
  if(paymentSlipFile && paymentSlipFile.size > 6 * 1024 * 1024){ alert('Payment slip file is too large — please keep it under 6MB.'); return; }

  let followUps = [];
  if(document.getElementById('f_followup_toggle').checked){
    followUps = Array.from(document.querySelectorAll('#followupRows .followup-row')).map(row => ({
      description: row.querySelector('.fu-desc-input').value.trim(),
      dueDate: row.querySelector('.fu-date-input').value || null
    })).filter(f => f.description);
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Submitting...';

  try{
    const order = await apiFetch('/orders', { method:'POST', body: JSON.stringify({ salesperson: sales, salespersonEmail: salesEmail, customer, address, amount, items, notes, followUps, poNumber, isCashSale }) });

    if(paymentSlipFile){
      btn.textContent = 'Uploading payment slip...';
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(paymentSlipFile);
      });
      try{
        await apiFetch(`/orders/${order.id}/payment-slip`, {
          method:'POST',
          body: JSON.stringify({ fileName: paymentSlipFile.name, fileType: paymentSlipFile.type, dataBase64: base64 })
        });
      }catch(slipErr){
        alert(`Order ${order.id} was submitted, but the payment slip failed to upload: ${slipErr.message}. You can ask admin to add it manually.`);
      }
    }

    btn.disabled = false; btn.textContent = 'Submit Order to Admin';
    const confirm = document.getElementById('confirmMsg');
    confirm.style.display = 'block';
    confirm.textContent = `✓ Submitted — Order ID ${order.id}`;
    document.getElementById('f_customer').value='';
    document.getElementById('f_address').value='';
    document.getElementById('f_amount').value='';
    document.getElementById('f_items').value='';
    document.getElementById('f_notes').value='';
    document.getElementById('f_po_number').value='';
    document.getElementById('f_cash_sale').checked = false;
    document.getElementById('f_payment_slip').value = '';
    document.getElementById('f_followup_toggle').checked = false;
    document.getElementById('followupSection').classList.remove('open');
    document.getElementById('followupRows').innerHTML = '';
    lineItems = [];
    renderLineItems();
    setTimeout(()=>{ confirm.style.display='none'; }, 5000);
  }catch(e){
    btn.disabled = false; btn.textContent = 'Submit Order to Admin';
  }
}

// ---------- TABS ----------
function showTab(which){
  const tabs = { sales: 'tabSales', track: 'tabTrack', admin: 'tabAdmin', products: 'tabProducts' };
  const views = { sales: 'salesView', track: 'trackView', admin: 'adminView', products: 'productsView' };
  Object.keys(tabs).forEach(k => {
    document.getElementById(tabs[k]).classList.toggle('active', k === which);
    document.getElementById(views[k]).style.display = (k === which) ? 'block' : 'none';
  });
  if(which === 'track') renderTrackOrders();
  if(which === 'admin') renderAdmin();
  if(which === 'products') renderProducts();
}
document.getElementById('tabSales').onclick = () => showTab('sales');
document.getElementById('tabTrack').onclick = () => showTab('track');
document.getElementById('tabAdmin').onclick = () => showTab('admin');
document.getElementById('tabProducts').onclick = () => showTab('products');

function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

async function downloadOrderFile(orderId, kind){
  try{
    const res = await fetch(`${API}/orders/${orderId}/${kind}`, { headers: { 'Authorization': 'Bearer ' + authToken } });
    if(!res.ok) throw new Error('Download failed');
    const blob = await res.blob();
    const disposition = res.headers.get('Content-Disposition') || '';
    const match = disposition.match(/filename="(.+)"/);
    const filename = match ? match[1] : (kind === 'invoice-attachment' ? 'invoice' : 'PO-document');
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    window.URL.revokeObjectURL(url);
  }catch(err){
    alert(`Could not download ${kind === 'invoice-attachment' ? 'invoice' : 'PO document'}.`);
  }
}

function normalizeHeader(h){ return String(h||'').trim().toLowerCase().replace(/[^a-z]/g,''); }

// Strips currency symbols, thousand-separator commas, and stray spaces
// before parsing — handles values like "RM 1,200.00" or "1200" or "RM1200.5"
function cleanNumber(val){
  if(val === undefined || val === null || val === '') return 0;
  if(typeof val === 'number') return val;
  const cleaned = String(val).replace(/[^0-9.\-]/g, '');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}

function mapRowToProduct(row){
  const entries = Object.keys(row).map(k => ({ norm: normalizeHeader(k), val: row[k] }));

  // Finds the first header whose normalized text contains ALL keywords in
  // a given group, trying each group in order until one matches. This
  // means "Original Price", "Original Price (RM)", and "orig. price" all
  // resolve to the same field, instead of requiring an exact match.
  function find(...keywordGroups){
    for(const group of keywordGroups){
      const hit = entries.find(e => group.every(kw => e.norm.includes(kw)));
      if(hit) return hit.val;
    }
    return '';
  }

  const name = String(find(['name'], ['productname'], ['itemname'], ['description'])).trim();
  const priceOriginal = cleanNumber(find(
    ['original','price'], ['retail','price'], ['normal','price'], ['original'], ['price']
  ));
  const priceDoctor = cleanNumber(find(
    ['doctor','price'], ['dr','price'], ['doctor']
  ));
  const pricePharmacist = cleanNumber(find(
    ['pharmacist','price'], ['pharmacy','price'], ['pharmacist']
  ));

  return { name, priceOriginal, priceDoctor, pricePharmacist };
}

// Scans raw rows (array of arrays) to find which row is actually the
// header row — the first row containing a cell that looks like "Name" or
// similar. This means title rows, instructions, or blank spacer rows
// above the real headers don't break the import.
function findHeaderRowIndex(rows2D){
  const nameKeywords = ['name', 'productname', 'itemname'];
  for(let i = 0; i < Math.min(rows2D.length, 15); i++){
    const row = rows2D[i] || [];
    const hasNameHeader = row.some(cell => nameKeywords.includes(normalizeHeader(cell)));
    if(hasNameHeader) return i;
  }
  return 0; // fallback: assume row 1 if nothing matched
}

function rows2DToObjects(rows2D){
  const headerIdx = findHeaderRowIndex(rows2D);
  const headers = (rows2D[headerIdx] || []).map(h => String(h||'').trim());
  const objects = [];
  for(let i = headerIdx + 1; i < rows2D.length; i++){
    const row = rows2D[i] || [];
    if(row.every(cell => String(cell||'').trim() === '')) continue; // skip blank rows
    const obj = {};
    headers.forEach((h, idx) => { if(h) obj[h] = row[idx]; });
    objects.push(obj);
  }
  return objects;
}

function handleCatalogFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const ext = file.name.split('.').pop().toLowerCase();

  if(ext === 'csv'){
    Papa.parse(file, {
      header: false, skipEmptyLines: true,
      complete: (results) => {
        const objects = rows2DToObjects(results.data);
        parsedImportRows = objects.map(mapRowToProduct).filter(p => p.name);
        showImportPreview();
      }
    });
  } else {
    const reader = new FileReader();
    reader.onload = (evt) => {
      const wb = XLSX.read(evt.target.result, { type: 'binary' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows2D = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      const objects = rows2DToObjects(rows2D);
      parsedImportRows = objects.map(mapRowToProduct).filter(p => p.name);
      showImportPreview();
    };
    reader.readAsBinaryString(file);
  }
}

function showImportPreview(){
  const wrap = document.getElementById('importPreviewWrap');
  if(parsedImportRows.length === 0){
    wrap.innerHTML = '<div class="ts" style="color:var(--pending);margin-top:12px;">No valid rows found. Check that your file has a Name column.</div>';
    return;
  }
  const preview = parsedImportRows.slice(0, 8);
  wrap.innerHTML = `
    <div style="text-align:left;margin-top:16px;">
      <div class="ts" style="margin-bottom:8px;">Preview (${parsedImportRows.length} rows found, showing first ${preview.length}):</div>

      alert(e.message || 'Import failed');

    }
  };
}

async function exportOrders(format){
  const params = new URLSearchParams();
  if(currentFilter !== 'all'){
    if(currentFilter.startsWith('ship:')) params.set('fulfillment', currentFilter.split(':')[1]);
    else params.set('status', currentFilter);
  }
  const from = document.getElementById('exportFrom').value;
  const to = document.getElementById('exportTo').value;
  if(from) params.set('from', from);
  if(to) params.set('to', to + 'T23:59:59');

  const btn = format === 'csv' ? document.getElementById('exportCsvBtn') : document.getElementById('exportXlsxBtn');
  const originalText = btn.textContent;
  btn.disabled = true; btn.textContent = 'Preparing…';

  try{
    const res = await fetch(`${API}/orders/export.${format}?${params.toString()}`, {
      headers: { 'Authorization': 'Bearer ' + authToken }
    });
    if(!res.ok){
      if(res.status === 401 || res.status === 403){
        alert('Session expired or not authorized. Please log in again.');
        document.getElementById('logoutBtn').click();
        return;
      }
      throw new Error('Export failed');
    }
    const blob = await res.blob();
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `orders-${new Date().toISOString().slice(0,10)}.${format}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.URL.revokeObjectURL(url);
  }catch(e){
    alert('Export failed. Please try again.');
  }finally{
    btn.disabled = false; btn.textContent = originalText;
  }
}
